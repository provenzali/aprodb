[package]
name = "aprodb-storage"
version = "0.1.0"
edition = "2024"
authors = ["Andrea Provenzali"]
license = "AGPL-3.0-only"
repository = "https://github.com/provenzali/aprodb"
description = "Contratto storage e adattatore Fjall di AProDB"

[dependencies]
aprodb-types = { path = "../aprodb-types", version = "0.1.0" }
chacha20poly1305 = "0.10"
fjall = "=3.1.8"
fs4 = "0.13"
getrandom = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
zstd = "0.13"
