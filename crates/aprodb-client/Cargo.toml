[package]
name = "aprodb-client"
version = "0.1.0"
edition = "2024"
authors = ["Andrea Provenzali"]
license = "Apache-2.0"
repository = "https://github.com/provenzali/aprodb"
description = "Client Rust asincrono e bloccante per AProDB"

[dependencies]
aprodb-proto = { path = "../aprodb-proto", version = "0.1.0" }
aprodb-types = { path = "../aprodb-types", version = "0.1.0" }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
rustls = "0.23"
rustls-pemfile = "2"
thiserror = "2"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["macros"] }
