[package]
name = "aprodb-engine"
version = "0.1.0"
edition = "2024"
authors = ["Andrea Provenzali"]
license = "AGPL-3.0-only"
repository = "https://github.com/provenzali/aprodb"
description = "Motore canonico single-node di AProDB"

[features]
default = []
gpu = ["aprodb-compute/gpu"]

[dependencies]
aprodb-compute = { path = "../aprodb-compute", version = "0.1.0" }
aprodb-storage = { path = "../aprodb-storage", version = "0.1.0" }
aprodb-types = { path = "../aprodb-types", version = "0.1.0" }
bincode = { version = "2.0", features = ["serde"] }
blake3 = "1"
crc32fast = "1.5"
fs2 = "0.4"
getrandom = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[dev-dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
