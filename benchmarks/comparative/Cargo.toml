[package]
name = "aprodb-comparative-bench"
version = "0.1.0"
edition = "2024"
authors = ["Andrea Provenzali"]
license = "AGPL-3.0-only"
repository = "https://github.com/provenzali/aprodb"
publish = false

[dependencies]
aprodb = { path = "../..", default-features = false }
clap = { version = "4.6", features = ["derive"] }
hdrhistogram = "7.6"
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
postgres = "0.19.14"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
